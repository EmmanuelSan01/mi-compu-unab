<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiCompu U</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f97316 0%, #fb923c 50%, #fdba74 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .container {
      background: #581c87;
      border-radius: 20px;
      padding: 1.75rem;
      width: 100%;
      max-width: 780px;
      box-shadow: 0 8px 40px rgba(0,0,0,.3);
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand img {
      height: 52px;
      object-fit: contain;
      filter: brightness(0) invert(1);
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-text .app-name {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -.3px;
      line-height: 1;
    }
    .brand-text .app-name span { color: #fb923c; }
    .brand-text .app-sub {
      font-size: 12px;
      color: #d8b4fe;
      margin-top: 2px;
      letter-spacing: .3px;
    }

    /* ── Leyenda ── */
    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.1);
      border: 1.5px solid rgba(255,255,255,.15);
      border-radius: 12px;
      padding: 6px 14px;
      cursor: default;
      transition: transform .15s, background .15s;
    }
    .legend-item:hover { transform: translateY(-2px); background: rgba(255,255,255,.18); }
    .legend-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2.5px solid transparent;
      flex-shrink: 0;
    }
    .dot-ok   { background: #22c55e; border-color: #16a34a; box-shadow: 0 0 6px #22c55e88; }
    .dot-sel  { background: #f97316; border-color: #ea580c; box-shadow: 0 0 6px #f9731688; }
    .dot-busy { background: #94a3b8; border-color: #64748b; }
    .legend-label { font-size: 12px; font-weight: 600; color: #fff; }

    /* ── Tablero docente ── */
    .desk-wrapper {
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: center;
    }
    .desk {
      background: linear-gradient(90deg, #6b21a8, #7e22ce, #6b21a8);
      border: 2.5px solid #a855f7;
      border-radius: 14px;
      padding: 14px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: default;
      transition: box-shadow .2s, transform .15s;
      box-shadow: 0 0 0 rgba(168,85,247,0);
      position: relative;
      overflow: hidden;
    }
    .desk::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(168,85,247,.15), transparent);
      animation: shimmer 2.5s infinite;
    }
    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .desk:hover {
      box-shadow: 0 0 20px rgba(168,85,247,.6);
      transform: translateY(-2px);
    }
    .desk-icon {
      width: 36px; height: 36px;
      background: rgba(168,85,247,.3);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .desk-text { display: flex; flex-direction: column; }
    .desk-label { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: .5px; }
    .desk-sub   { font-size: 11px; color: #d8b4fe; margin-top: 1px; }
    .desk-badge {
      background: #a855f7;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: .4px;
      animation: pulse-badge 2s infinite;
    }
    @keyframes pulse-badge {
      0%, 100% { opacity: 1; }
      50%       { opacity: .6; }
    }

    /* ── Grid de PCs ── */
    .pc-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .pc-seat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px 7px;
      border-radius: 12px;
      border: 3px solid #16a34a;
      cursor: pointer;
      background: #f0fdf4;
      transition: border-color .15s, background .15s, transform .12s, box-shadow .15s;
      user-select: none;
      position: relative;
    }
    .pc-seat::after {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: 13px;
      box-shadow: 0 0 0 0 rgba(34,197,94,0);
      transition: box-shadow .2s;
    }
    .pc-seat:hover:not(.occupied) {
      border-color: #15803d;
      background: #dcfce7;
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 6px 18px rgba(22,163,74,.35);
    }
    .pc-seat:hover:not(.occupied)::after {
      box-shadow: 0 0 0 3px rgba(34,197,94,.25);
    }
    .pc-seat:focus-visible { outline: 2px solid #f97316; outline-offset: 3px; }

    .pc-seat.selected {
      border-color: #ea580c;
      background: #fff7ed;
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 6px 20px rgba(234,88,12,.4);
    }
    .pc-seat.selected::after {
      box-shadow: 0 0 0 3px rgba(249,115,22,.3);
    }
    .pc-seat.occupied {
      background: #f1f5f9;
      border-color: #94a3b8;
      cursor: not-allowed;
      opacity: .5;
      transform: none;
      box-shadow: none;
    }
    .pc-seat img {
      width: 54px; height: 54px;
      object-fit: contain;
      pointer-events: none;
      transition: filter .15s;
    }
    .pc-seat.occupied img   { filter: grayscale(1) brightness(.85); }
    .pc-seat.selected img   { filter: drop-shadow(0 2px 6px rgba(249,115,22,.5)); }
    .pc-seat:hover:not(.occupied) img { filter: drop-shadow(0 2px 6px rgba(22,163,74,.4)); }

    .pc-label {
      font-size: 10px;
      margin-top: 5px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .pc-seat:not(.occupied):not(.selected) .pc-label { color: #15803d; }
    .pc-seat.selected .pc-label { color: #c2410c; }
    .pc-seat.occupied .pc-label { color: #94a3b8; }

    /* ── Footer ── */
    .footer-bar {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .avail-info {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px;
      padding: 7px 20px;
      font-size: 13px;
      color: #e9d5ff;
    }
    .avail-info strong { color: #fff; font-size: 15px; }

    .btn-reserve {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px 40px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: .3px;
      transition: transform .12s, box-shadow .15s, opacity .15s;
      box-shadow: 0 4px 16px rgba(249,115,22,.5);
    }
    .btn-reserve:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(249,115,22,.6);
    }
    .btn-reserve:active:not(:disabled) { transform: scale(.97); }
    .btn-reserve:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: #f97316;
      border-radius: 20px;
      padding: 0;
      width: 100%;
      max-width: 370px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .modal-header {
      background: linear-gradient(135deg, #ea580c, #c2410c);
      padding: 1.25rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-header h2 { font-size: 16px; font-weight: 700; color: #fff; }
    .modal-pc-tag {
      background: rgba(255,255,255,.25);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
    }
    .modal-body { padding: 1.5rem 1.75rem 1.75rem; }

    .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .form-row label { font-size: 13px; color: #fff7ed; font-weight: 600; letter-spacing: .2px; }
    .form-row input, .form-row select {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid rgba(255,255,255,.4);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      color: #1a1a1a;
      background: #fff;
      transition: border-color .15s;
    }
    .form-row input:focus, .form-row select:focus { border-color: #fff; }
    .form-2col { display: flex; gap: 10px; }
    .form-2col .form-row { flex: 1; }

    .btn-confirm {
      width: 100%;
      background: #fff;
      color: #c2410c;
      border: none;
      border-radius: 10px;
      padding: 11px 20px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 700;
      margin-top: 4px;
      transition: background .15s, transform .1s;
      letter-spacing: .2px;
    }
    .btn-confirm:hover { background: #fff7ed; transform: translateY(-1px); }

    .btn-cancel {
      width: 100%;
      background: transparent;
      color: rgba(255,255,255,.8);
      border: 1.5px solid rgba(255,255,255,.4);
      border-radius: 10px;
      padding: 9px 20px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s;
    }
    .btn-cancel:hover { background: rgba(255,255,255,.1); }

   
    .toast {  
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #166534;
      border: 1px solid #22c55e;
      color: #fff;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      z-index: 200;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="sr-only">MiCompu U — Reserva de computadores</h1>

  <div class="header">
    <div class="brand">
      <img src="https://unab.edu.co/wp-content/uploads/2023/09/logo-universidad-unab.png" alt="Logo UNAB" />
      <div class="brand-text">
        <span class="app-name">MiCompu<span>U</span></span>
        <span class="app-sub">Reserva de computadores</span>
      </div>
    </div>
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot dot-ok"></div>
        <span class="legend-label">Disponible</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot dot-sel"></div>
        <span class="legend-label">Seleccionado</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot dot-busy"></div>
        <span class="legend-label">Ocupado</span>
      </div>
    </div>
  </div>

  <div class="desk-wrapper">
    <div class="desk">
      <div class="desk-icon">🖥️</div>
      <div class="desk-text">
        <span class="desk-label">TABLERO — DOCENTE</span>
        <span class="desk-sub">Frente del salón</span>
      </div>
      <span class="desk-badge">EN CLASE</span>
    </div>
  </div>

  <div class="pc-grid" id="pc-grid"></div>

  <div class="footer-bar">
    <div class="avail-info">
      Computadores disponibles: <strong id="avail-count">24</strong> / 24
    </div>
    <button class="btn-reserve" id="btn-reserve" disabled>Reservar computador</button>
  </div>
</div>

<div id="toast" class="toast" role="alert" aria-live="polite"></div>

<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modal-title">Confirmar reserva</h2>
      <span class="modal-pc-tag" id="modal-pc-tag"></span>
    </div>
    <div class="modal-body">
      <div class="form-2col">
        <div class="form-row">
          <label for="f-fecha">Fecha</label>
          <input type="date" id="f-fecha" />
        </div>
        <div class="form-row">
          <label for="f-hora">Hora</label>
          <select id="f-hora">
            <option>07:00</option><option>08:00</option><option>09:00</option>
            <option>10:00</option><option>11:00</option><option>12:00</option>
            <option>13:00</option><option>14:00</option><option>15:00</option>
            <option>16:00</option><option>17:00</option><option>18:00</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label for="f-motivo">Motivo de uso</label>
        <select id="f-motivo">
          <option>Clase / práctica</option>
          <option>Trabajo independiente</option>
          <option>Examen</option>
          <option>Investigación</option>
          <option>Otro</option>
        </select>
      </div>
      <button class="btn-confirm" id="btn-confirm">Confirmar reserva</button>
      <button class="btn-cancel" id="btn-cancel">Cancelar</button>
    </div>
  </div>
</div>

  var occupied = new Set();
  var reservations = {};
  var selected = null;

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function render() {
    var grid = document.getElementById('pc-grid');
    grid.innerHTML = '';
    for (var i = 0; i < 24; i++) {
      var num = i + 1;
      var isOcc = occupied.has(i);
      var isSel = selected === i;

      var div = document.createElement('div');
      div.className = 'pc-seat' + (isOcc ? ' occupied' : '') + (isSel ? ' selected' : '');
      div.setAttribute('role', 'button');
      div.setAttribute('tabindex', isOcc ? '-1' : '0');
      div.setAttribute('aria-label', 'PC-' + pad(num) + (isOcc ? ', ocupado' : isSel ? ', seleccionado' : ', disponible'));
      div.dataset.idx = i;

      var img = document.createElement('img');
      img.src = IMG;
      img.alt = '';
      div.appendChild(img);

      var lbl = document.createElement('span');
      lbl.className = 'pc-label';
      lbl.textContent = 'PC-' + pad(num);
      div.appendChild(lbl);

      if (!isOcc) {
        div.addEventListener('click', onSelect);
        div.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onSelect.call(this); }
        });
      }
      grid.appendChild(div);
    }
    document.getElementById('avail-count').textContent = 24 - occupied.size;
    document.getElementById('btn-reserve').disabled = !(selected !== null && !occupied.has(selected));
  }

  function onSelect() {
    var idx = parseInt(this.dataset.idx, 10);
    selected = (selected === idx) ? null : idx;
    render();
  }

  document.getElementById('btn-reserve').addEventListener('click', function () {
    if (selected === null) return;
    document.getElementById('modal-pc-tag').textContent = 'PC-' + pad(selected + 1);
    document.getElementById('f-fecha').value = new Date().toISOString().split('T')[0];
    document.getElementById('modal').classList.add('active');
    document.getElementById('f-fecha').focus();
  });

  function closeModal() { document.getElementById('modal').classList.remove('active'); }

  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  document.getElementById('btn-confirm').addEventListener('click', function () {
    var fecha  = document.getElementById('f-fecha').value;
    var hora   = document.getElementById('f-hora').value;
    var motivo = document.getElementById('f-motivo').value;
    if (!fecha) { alert('Selecciona una fecha.'); return; }
    reservations[selected] = { fecha: fecha, hora: hora, motivo: motivo };
    occupied.add(selected);
    var pcNum = pad(selected + 1);
    selected = null;
    closeModal();
    showToast('✓ Reserva confirmada — PC-' + pcNum + ' · ' + fecha + ' · ' + hora);
    render();
  });

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function () { t.classList.remove('show'); }, 4000);
  }

  render();
})();
</script>
