<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../web/css/login.css">
  <script type="module" src="../web/js/login.js" defer></script>
  <title>MiCompu U — Log in</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange:      #f97316;
      --orange-dark: #ea580c;
      --orange-deep: #c2410c;
      --purple:      #7e22ce;
      --purple-mid:  #6b21a8;
      --purple-dark: #581c87;
      --purple-deep: #3b0764;
      --white:       #ffffff;
      --off-white:   #fff7ed;
    }

    body {
      font-family: "DM Sans", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--orange);
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 10% 20%, rgba(234,88,12,.6) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 90% 80%, rgba(194,65,12,.5) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(253,186,116,.3) 0%, transparent 80%);
      pointer-events: none;
    }

    .bubble { position: fixed; border-radius: 50%; background: rgba(255,255,255,.06); pointer-events: none; }
    .bubble-1 { width: 320px; height: 320px; top: -80px; left: -80px; animation: float1 8s ease-in-out infinite; }
    .bubble-2 { width: 200px; height: 200px; bottom: -40px; right: -40px; animation: float2 6s ease-in-out infinite; }
    .bubble-3 { width: 120px; height: 120px; top: 40%; left: 5%; animation: float1 10s ease-in-out infinite reverse; }
    .bubble-4 { width: 80px;  height: 80px;  bottom: 20%; right: 8%; animation: float2 7s ease-in-out infinite; }

    @keyframes float1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(20px,-20px) scale(1.05); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-15px,15px) scale(1.08); } }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      background: var(--purple-dark);
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 2px 0 rgba(255,255,255,.08) inset,
        0 24px 80px rgba(59,7,100,.5),
        0 4px 24px rgba(0,0,0,.3);
      animation: card-in .6s cubic-bezier(.22,.68,0,1.2) both;
    }
    @keyframes card-in {
      from { opacity:0; transform: translateY(32px) scale(.96); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    .hero {
      background: linear-gradient(160deg, var(--purple-deep) 0%, var(--purple-dark) 60%, var(--purple-mid) 100%);
      padding: 2.5rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      border-bottom: 2px solid rgba(168,85,247,.25);
    }
    .hero::after {
      content: "";
      position: absolute;
      bottom: -60px; right: -60px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(249,115,22,.15) 0%, transparent 70%);
    }
    .hero-logo {
      height: 52px;
      object-fit: contain;
      filter: brightness(0) invert(1);
      animation: logo-in .5s .2s ease both;
    }
    @keyframes logo-in {
      from { opacity:0; transform: translateY(-10px); }
      to   { opacity:1; transform: translateY(0); }
    }
    .hero-divider {
      width: 48px; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(168,85,247,.8), transparent);
      border-radius: 2px;
    }
    .hero-appname {
      font-family: "Syne", sans-serif;
      font-size: 48px;
      font-weight: 600;
      color: var(--white);
      letter-spacing: -1.5px;
      line-height: 1;
      text-align: center;
      animation: logo-in .5s .3s ease both;
    }
    .hero-appname span { color: var(--orange); text-shadow: 0 0 24px rgba(249,115,22,.6); }
    .hero-sub {
      font-size: 12px;
      color: #c4b5fd;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 300;
      animation: logo-in .5s .4s ease both;
    }

    .form-area { padding: 2rem 2rem 2.25rem; }

    .form-title {
      font-family: "Syne", sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 1.5rem;
      letter-spacing: -.3px;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 1.1rem; }

    label { font-size: 12px; font-weight: 600; color: #c4b5fd; letter-spacing: .8px; text-transform: uppercase; }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(168,85,247,.3);
      border-radius: 12px;
      font-size: 14px;
      color: var(--white);
      font-family: "DM Sans", sans-serif;
      outline: none;
      transition: border-color .2s, background .2s, box-shadow .2s;
    }
    input::placeholder { color: rgba(255,255,255,.3); }
    input:focus {
      border-color: var(--orange);
      background: rgba(249,115,22,.08);
      box-shadow: 0 0 0 3px rgba(249,115,22,.15);
    }

    .error-message { font-size: 12px; color: #fca5a5; display: none; margin-top: 2px; }
    .error-message.visible { display: block; }

    .button {
      width: 100%;
      margin-top: 0.5rem;
      padding: 13px;
      background: linear-gradient(135deg, var(--orange), var(--orange-dark));
      color: var(--white);
      font-family: "Syne", sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .4px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(249,115,22,.5);
      transition: transform .12s, box-shadow .15s;
      position: relative;
      overflow: hidden;
    }
    .button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transform: translateX(-100%);
      transition: transform .4s;
    }
    .button:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(249,115,22,.6); }
    .button:hover::after { transform: translateX(100%); }
    .button:active { transform: scale(.98); }

    .signup-link { margin-top: 1.25rem; text-align: center; font-size: 13px; color: rgba(196,181,253,.7); }
    .signup-link a { color: var(--orange); font-weight: 600; text-decoration: none; transition: color .15s; }
    .signup-link a:hover { color: #fdba74; }

    .form-group:nth-child(1) { animation: card-in .4s .45s ease both; }
    .form-group:nth-child(2) { animation: card-in .4s .55s ease both; }
    .button      { animation: card-in .4s .65s ease both; }
    .signup-link { animation: card-in .4s .72s ease both; }
  </style>
</head>
<body>

  <div class="bubble bubble-1"></div>
  <div class="bubble bubble-2"></div>
  <div class="bubble bubble-3"></div>
  <div class="bubble bubble-4"></div>

  <div class="card">
    <div class="hero">
      <img class="hero-logo" src="https://unab.edu.co/impulsa/wp-content/uploads/2025/07/logo-u-vig.png" alt="Logo Universidad UNAB" />
      <div class="hero-divider"></div>
      <span class="hero-appname">MiCompu<span>U</span></span>
      <span class="hero-sub">Reserva de computadores</span>
    </div>

    <div class="form-area">
      <p class="form-title">Iniciar sesión</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" name="email" id="email" placeholder="usuario@unab.edu.co" required>
          <div id="emailError" class="error-message">Correo no registrado. Regístrate.</div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" name="password" id="password" placeholder="••••••••" required>
          <div id="passwordError" class="error-message">Contraseña incorrecta.</div>
        </div>

        <button type="submit" class="button">Ingresar</button>
      </form>

      <div class="signup-link">
        ¿No tienes cuenta? <a href="../pages/register.html">Regístrate aquí</a>
      </div>
    </div>
  </div>

</body>
</html>
