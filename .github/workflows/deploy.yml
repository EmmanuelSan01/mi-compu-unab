name: Deploy web folder to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Limpiar despliegues antiguos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALL_DEPLOYS=$(gh api -X GET repos/${{ github.repository }}/deployments -F per_page=100)

          if [ -z "$ALL_DEPLOYS" ] || [ "$ALL_DEPLOYS" = "null" ]; then
            exit 0
          fi

          CURRENT_DEPLOY_ID=$(echo "$ALL_DEPLOYS" | jq -r '.[0].id // ""')

          echo "$ALL_DEPLOYS" | jq -r '.[] | select(.environment == "github-pages") | .id' | while read -r id; do
            if [ ! -z "$id" ] && [ "$id" != "null" ] && [ "$id" != "$CURRENT_DEPLOY_ID" ]; then
              gh api -X POST repos/${{ github.repository }}/deployments/$id/statuses \
                -H "Accept: application/vnd.github+json" \
                -f state="inactive" > /dev/null 2>&1 || true

              gh api -X DELETE repos/${{ github.repository }}/deployments/$id
            fi
          done