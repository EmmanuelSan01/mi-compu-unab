name: Deploy web folder to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Limpiar despliegues antiguos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEPLOYMENTS=$(gh api repos/${{ github.repository }}/deployments |
            jq -c '.[] | select(.environment == "github-pages")')

          echo "$DEPLOYMENTS" | while read -r deploy; do
            ID=$(echo "$deploy" | jq '.id')
            gh api -X DELETE repos/${{ github.repository }}/deployments/$ID
          done